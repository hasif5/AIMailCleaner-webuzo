# AI Mail Cleaner — admin panel locations (ports 2004/2005)
# Server-wide AI settings (API keys) and an overview of every mailbox: root FPM.
# The page itself refuses to run unless is_admin_panel() and the user is root.
location ~ ^(/mailcleaner/|/mailcleaner/index\.php)$ {
	fastcgi_pass	unix:/usr/local/emps/var/fpm-root.sock;
	fastcgi_read_timeout 300;
	fastcgi_index	index.php;
	fastcgi_param	SCRIPT_FILENAME  $document_root/mailcleaner/index.php;
	fastcgi_param	SCRIPT_NAME	  /mailcleaner/index.php;
	include			fastcgi_params;
}
