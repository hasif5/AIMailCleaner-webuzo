# AI Mail Cleaner — enduser panel locations
# UI: root FPM (reads root-only settings and per-mailbox state, queues jobs for the
# root runner). Auth is enforced in PHP via the Webuzo sessions SDK. There is no
# public / non-root endpoint.
location ~ ^(/mailcleaner/|/mailcleaner/index\.php)$ {
	fastcgi_pass	unix:/usr/local/emps/var/fpm-root.sock;
	fastcgi_read_timeout 300;
	fastcgi_index	index.php;
	fastcgi_param	SCRIPT_FILENAME  $document_root/mailcleaner/index.php;
	fastcgi_param	SCRIPT_NAME	  /mailcleaner/index.php;
	include			fastcgi_params;
}
